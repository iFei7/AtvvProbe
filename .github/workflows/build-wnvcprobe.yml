name: build-wnvcprobe
on:
  push:
    branches: [wnvc]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          set -x
          armv7a-linux-androideabi28-clang -O2 -Wall -o wnvc_probe wnvc_probe.c -ldl -lm
          armv7a-linux-androideabi28-clang -O2 -Wall -o wnvc_probe2 wnvc_probe2.c -ldl -lm
          armv7a-linux-androideabi28-clang -O2 -Wall -o wnvc_probe3 wnvc_probe3.c -ldl -lm
          armv7a-linux-androideabi28-clang -O2 -Wall -o wnvc_probe4 wnvc_probe4.c -ldl -lm
          armv7a-linux-androideabi28-clang -O2 -Wall -o vaudio_harness vaudio_harness.c -ldl -lm
          ls -la wnvc_probe vaudio_harness
          file vaudio_harness || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wnvcprobe
          path: |
            wnvc_probe
            wnvc_probe2
            wnvc_probe3
            wnvc_probe4
            vaudio_harness
