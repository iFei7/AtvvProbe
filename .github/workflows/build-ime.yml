name: build-ime

on:
  push:
    branches: [ime]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: android
        run: gradle test --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/ || true
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: murmur-ime-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murmur-ime-test-report
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: warn
